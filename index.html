<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>공부 게임</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"
 onerror="(function(){var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';s.onerror=function(){window.__peerLoadFailed=true;};document.head.appendChild(s);})()"></script>

<style>
*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent;
}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 font-family:Arial,"Noto Sans KR",sans-serif;
 background:#080c16;
 color:#fff;
}

button,input{
 font:inherit;
}

button{
 cursor:pointer;
 touch-action:manipulation;
}

.hidden{
 display:none!important;
}

/* 시작 화면 */

#start{
 width:100%;
 height:100dvh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:18px;
 background:
 radial-gradient(circle at 15% 15%,#354fa5 0,transparent 35%),
 radial-gradient(circle at 85% 85%,#703e91 0,transparent 35%),
 #080c16;
}

.card{
 width:min(430px,100%);
 padding:28px;
 border:1px solid #34405d;
 border-radius:24px;
 background:#131b2f;
 box-shadow:0 30px 100px #0009;
}

.logo{
 text-align:center;
 font-size:34px;
 font-weight:1000;
 letter-spacing:1px;
}

.sub{
 text-align:center;
 color:#8290aa;
 font-size:12px;
 margin:8px 0 25px;
}

label{
 display:block;
 color:#8d9ab3;
 font-size:11px;
 margin:12px 0 6px;
}

.input{
 width:100%;
 height:50px;
 border:1px solid #38445f;
 border-radius:11px;
 outline:none;
 background:#0e1527;
 color:#fff;
 padding:0 13px;
}

.input:focus{
 border-color:#7086ff;
}

.primary{
 width:100%;
 height:50px;
 margin-top:10px;
 border:0;
 border-radius:11px;
 background:linear-gradient(135deg,#607cff,#8658e5);
 color:white;
 font-weight:900;
}

.sep{
 display:flex;
 align-items:center;
 gap:10px;
 margin:18px 0;
 color:#536079;
 font-size:10px;
}

.sep:before,
.sep:after{
 content:"";
 height:1px;
 flex:1;
 background:#2c354b;
}

#error{
 min-height:18px;
 margin-top:9px;
 text-align:center;
 color:#ff7084;
 font-size:11px;
}

/* 앱 */

#app{
 width:100%;
 height:100dvh;
 display:grid;
 grid-template-columns:230px 1fr;
}

.side{
 background:#101629;
 border-right:1px solid #28334c;
 display:flex;
 flex-direction:column;
 min-height:0;
}

.roomBox{
 padding:16px;
 border-bottom:1px solid #28334c;
}

.roomTitle{
 font-weight:1000;
}

.roomCode{
 margin-top:10px;
 padding:11px;
 border-radius:9px;
 background:#202a47;
 color:#aebcff;
 text-align:center;
 font-size:20px;
 font-weight:1000;
 letter-spacing:5px;
}

.sideBtn{
 width:100%;
 height:41px;
 margin-top:8px;
 border:1px solid #35405b;
 border-radius:9px;
 background:#171f34;
 color:#e0e5f0;
}

.peopleTitle{
 padding:13px 12px 5px;
 color:#74819b;
 font-size:10px;
 font-weight:900;
}

.users{
 flex:1;
 min-height:0;
 overflow:auto;
 padding:4px 9px;
}

.user{
 display:flex;
 align-items:center;
 gap:9px;
 padding:8px;
 border-radius:9px;
}

.avatar{
 width:34px;
 height:34px;
 flex:none;
 display:flex;
 align-items:center;
 justify-content:center;
 border-radius:50%;
 background:linear-gradient(135deg,#5d78ff,#8759e6);
 font-weight:900;
}

.userName{
 min-width:0;
 overflow:hidden;
 white-space:nowrap;
 text-overflow:ellipsis;
 font-size:12px;
}

.host{
 color:#ffd65c;
 font-size:9px;
 margin-left:4px;
}

.teamA{
 color:#ff7080;
}

.teamB{
 color:#6790ff;
}

.bottom{
 padding:10px;
}

.leave{
 color:#ff788d;
}

/* 채팅 */

.main{
 min-width:0;
 min-height:0;
 display:flex;
 flex-direction:column;
}

.header{
 height:58px;
 flex:none;
 padding:0 15px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 background:#0e1424;
 border-bottom:1px solid #28334c;
}

.headerTitle{
 font-weight:900;
}

.status{
 color:#8390a9;
 font-size:10px;
}

.dot{
 display:inline-block;
 width:7px;
 height:7px;
 margin-right:5px;
 border-radius:50%;
 background:#35df88;
 box-shadow:0 0 8px #35df88;
}

.messages{
 flex:1;
 min-height:0;
 overflow:auto;
 padding:15px;
}

.message{
 display:flex;
 margin-bottom:12px;
}

.message.mine{
 justify-content:flex-end;
}

.messageInner{
 max-width:75%;
}

.messageInfo{
 color:#8491aa;
 font-size:9px;
 margin-bottom:4px;
}

.mine .messageInfo{
 text-align:right;
}

.bubble{
 padding:10px 12px;
 border-radius:12px;
 background:#19223a;
 line-height:1.45;
 word-break:break-word;
}

.mine .bubble{
 background:linear-gradient(135deg,#5975e5,#7859d8);
}

.system{
 margin:9px;
 text-align:center;
 color:#69768e;
 font-size:10px;
}

.system span{
 padding:6px 10px;
 border-radius:20px;
 background:#121a2c;
}

.chat{
 flex:none;
 padding:9px;
 padding-bottom:max(9px,env(safe-area-inset-bottom));
 background:#0e1424;
 border-top:1px solid #28334c;
}

.chatForm{
 display:flex;
 gap:7px;
}

.chatInput{
 flex:1;
 min-width:0;
 height:45px;
 border:1px solid #38445f;
 border-radius:11px;
 background:#141c30;
 color:#fff;
 padding:0 12px;
 outline:none;
}

.send{
 width:62px;
 border:0;
 border-radius:11px;
 background:#607af4;
 color:#fff;
 font-weight:900;
}

/* 게임 */

#game{
 position:fixed;
 inset:0;
 z-index:100;
 display:flex;
 flex-direction:column;
 background:#080c16;
}

.gameHeader{
 height:58px;
 flex:none;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 13px;
 background:#11182b;
 border-bottom:1px solid #2b3650;
}

.closeGame{
 min-height:40px;
 padding:0 14px;
 border:1px solid #394560;
 border-radius:9px;
 background:#202a42;
 color:#fff;
}

.gameBody{
 flex:1;
 min-height:0;
 overflow:auto;
 padding:14px;
}

.menu{
 width:min(900px,100%);
 margin:auto;
}

.menuTitle{
 text-align:center;
 margin-bottom:18px;
}

.menuTitle h1{
 margin:3px;
 font-size:28px;
}

.menuTitle p{
 color:#8592ab;
 font-size:11px;
}

.gamesGrid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:9px;
}

.gameCard{
 min-height:112px;
 padding:12px;
 border:1px solid #303b57;
 border-radius:15px;
 background:#141d32;
 color:#fff;
 text-align:left;
}

.gameCard:active{
 transform:scale(.97);
}

.gameIcon{
 font-size:26px;
}

.gameCard b{
 display:block;
 margin-top:6px;
 font-size:13px;
}

.gameCard small{
 display:block;
 margin-top:4px;
 color:#7d8aa4;
 font-size:9px;
 line-height:1.4;
}

.modes{
 margin:17px 0;
 text-align:center;
}

.mode{
 min-height:40px;
 padding:0 17px;
 margin:3px;
 border:1px solid #37435f;
 border-radius:9px;
 background:#141c31;
 color:#cbd4e6;
}

.mode.selected{
 background:#607af5;
 color:white;
}

.startBtn{
 min-height:46px;
 padding:0 25px;
 border:0;
 border-radius:11px;
 background:linear-gradient(135deg,#607bff,#8658e4);
 color:#fff;
 font-weight:900;
}

/* 플레이 */

.play{
 width:min(850px,100%);
 margin:auto;
 text-align:center;
}

.play h2{
 margin:3px 0 5px;
}

.info{
 color:#8794ad;
 font-size:11px;
 margin-bottom:13px;
}

.board{
 position:relative;
 width:100%;
 height:min(60vh,470px);
 min-height:280px;
 overflow:hidden;
 border:1px solid #303b58;
 border-radius:19px;
 background:#151e32;
}

/* 순간반응 */

.reaction{
 width:100%;
 height:100%;
 border:0;
 border-radius:18px;
 color:#fff;
 font-size:29px;
 font-weight:1000;
 user-select:none;
}

.red{
 background:#d63d4f;
}

.green{
 background:#1db66b;
}

.early{
 background:#71303e;
}

/* 타겟 */

.target{
 position:absolute;
 width:88px;
 height:88px;
 transform:translate(-50%,-50%);
 border:5px solid white;
 border-radius:50%;
 background:#ff536f;
 box-shadow:0 0 25px #ff536f;
}

/* 숫자 */

.number{
 width:min(600px,100%);
 margin:15px auto;
 padding:30px 10px;
 border-radius:17px;
 background:#151e34;
 font-size:50px;
 font-weight:1000;
 letter-spacing:6px;
}

.answer{
 width:min(300px,100%);
 height:47px;
 border:1px solid #394560;
 border-radius:10px;
 background:#10172a;
 color:#fff;
 text-align:center;
 outline:none;
}

.action{
 min-height:44px;
 margin:8px;
 padding:0 20px;
 border:0;
 border-radius:10px;
 background:#617bf4;
 color:#fff;
 font-weight:900;
}

/* 색 */

.colors{
 display:flex;
 flex-wrap:wrap;
 justify-content:center;
 gap:9px;
 margin:18px;
}

.colorBtn{
 width:105px;
 height:60px;
 border:3px solid white;
 border-radius:11px;
 color:white;
 font-weight:900;
}

/* 순서 */

.sequence{
 display:grid;
 grid-template-columns:repeat(3,80px);
 justify-content:center;
 gap:8px;
 margin:18px;
}

.seq{
 width:80px;
 height:63px;
 border:0;
 border-radius:10px;
 background:#273451;
 color:white;
 font-size:18px;
 font-weight:900;
}

/* 타일 */

.tileGrid{
 display:grid;
 grid-template-columns:repeat(4,80px);
 justify-content:center;
 gap:8px;
 margin:20px auto;
}

.tile{
 width:80px;
 height:70px;
 border:0;
 border-radius:11px;
 background:#273451;
 color:#fff;
 font-size:24px;
}

/* 모양 */

.shapes{
 display:flex;
 flex-wrap:wrap;
 justify-content:center;
 gap:10px;
 margin:20px;
}

.shape{
 width:105px;
 height:65px;
 border:1px solid #3b4660;
 border-radius:12px;
 background:#1a243b;
 color:#fff;
 font-size:25px;
}

/* 결과 */

.result{
 width:min(600px,100%);
 margin:20px auto;
 padding:16px;
 border:1px solid #35415d;
 border-radius:15px;
 background:#141d31;
}

.resultRow{
 display:flex;
 justify-content:space-between;
 padding:11px 4px;
 border-bottom:1px solid #27324b;
}

.resultRow:last-child{
 border-bottom:0;
}

.first{
 color:#ffd45e;
 font-weight:1000;
}


.userActions{margin-left:auto;display:flex;gap:4px;flex:none}
.dmBtn{border:1px solid #465477;border-radius:7px;background:#202b46;color:#cbd6ff;font-size:10px;padding:6px}
.historyPanel{width:min(760px,100%);margin:auto}
.historyCard{background:#141d32;border:1px solid #303b57;border-radius:14px;padding:14px;margin:10px 0}
.subjectChoices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:min(650px,100%);margin:18px auto}
.subjectChoice{min-height:64px;border:1px solid #485779;border-radius:12px;background:#202b46;color:white;font-weight:800;padding:10px}
.subjectChoice:active{transform:scale(.98)}


.featureModal{position:fixed;inset:0;z-index:300;background:#030712e8;display:flex;align-items:center;justify-content:center;padding:14px}
.featureCard{width:min(520px,100%);max-height:88dvh;overflow:auto;background:#131d33;border:1px solid #465779;border-radius:18px;padding:16px;box-shadow:0 20px 80px #000b}
.featureHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:17px}
.featureHead button,.featureAction{border:1px solid #485879;border-radius:9px;background:#263453;color:white;padding:9px 12px;min-height:38px}
.featureField{width:100%;height:44px;border:1px solid #405071;border-radius:9px;background:#0b1426;color:white;padding:0 11px;margin:6px 0 12px;font-size:16px}
.featureAction.primary{background:linear-gradient(135deg,#607cff,#8658e5);border:0;font-weight:800}
.featureRow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.featureHint{color:#9eabc4;font-size:12px;line-height:1.5;margin:6px 0 12px}
.privateLog{height:min(42dvh,330px);overflow:auto;background:#0b1426;border:1px solid #293753;border-radius:10px;padding:9px;margin:10px 0}
.privateLine{padding:7px 8px;margin:5px 0;border-radius:8px;background:#1b2945;overflow-wrap:anywhere}
.privateLine.mine{background:#465bb4;text-align:right}
.adminCode{font-size:24px;letter-spacing:5px;color:#b8c6ff;font-weight:1000;background:#0b1426;padding:12px;border-radius:10px;text-align:center}

/* 모바일 */

@media(max-width:750px){

 #app{
  display:block;
 }

 .side{
  display:none;
 }

 .header{
  height:54px;
 }

 .messages{
  padding:12px;
 }

 .messageInner{
  max-width:86%;
 }

 .gameBody{
  padding:10px;
 }

 .gamesGrid{
  grid-template-columns:repeat(2,1fr);
  gap:8px;
 }

 .gameCard{
  min-height:102px;
  padding:10px;
 }

 .board{
  height:calc(100dvh - 175px);
  max-height:520px;
 }

 .reaction{
  font-size:25px;
 }

 .tileGrid{
  grid-template-columns:repeat(4,1fr);
  max-width:350px;
 }

 .tile{
  width:100%;
 }

}

@media(max-width:430px){

 .card{
  padding:22px 18px;
 }

 .logo{
  font-size:29px;
 }

 .sequence{
  grid-template-columns:repeat(3,1fr);
  max-width:280px;
 }

 .seq{
  width:100%;
 }

 .colorBtn{
  width:44%;
 }

}

/* 태블릿 및 모바일 터치 최적화 */
#game{height:100vh;height:100dvh}
.gameBody{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
button,.gameCard,.mode,.subjectChoice{touch-action:manipulation}
.startBtn{position:relative;z-index:5;min-height:56px;min-width:190px;cursor:pointer;pointer-events:auto}
@media (min-width:700px) and (max-width:1100px){
 #app{grid-template-columns:210px minmax(0,1fr)}
 .gameBody{padding:22px}
 .gamesGrid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .menu{width:min(850px,100%)}
}
@media (max-width:700px){
 .gameBody{padding:12px 10px calc(16px + env(safe-area-inset-bottom))}
 .menu{width:100%;padding:12px}
 .modes{flex-wrap:wrap;gap:8px}
 .mode{min-height:48px;flex:1 1 28%}
 .subjectChoices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
 .subjectChoice{min-height:52px}
 .startBtn{width:100%;min-height:58px}
 .chatInput{min-width:0}
 .send{min-width:66px}
}


/* 추가 터치 조작 보정 */
#game{isolation:isolate}
#game .gameHeader{position:relative;z-index:3}
#game .gameBody{position:relative;z-index:1;overflow-y:auto;overscroll-behavior:contain}
#game .startBtn{display:block;margin:18px auto;min-height:58px;min-width:190px;position:relative;z-index:10;pointer-events:auto}
#game button{touch-action:manipulation}
@media (max-width:760px){
 html,body{overflow:hidden}
 #app{height:100dvh;min-height:0}
 .main{min-width:0;min-height:0}
 .messages{min-height:0}
 .chat{padding-bottom:calc(8px + env(safe-area-inset-bottom))}
 .chatForm{gap:7px}
 .chatInput{width:100%;min-width:0}
 .send{min-width:64px;min-height:46px}
 #game{width:100vw}
 #game .gameBody{padding:12px 10px calc(18px + env(safe-area-inset-bottom))}
}
@media (min-width:761px) and (max-width:1100px){
 #app{grid-template-columns:205px minmax(0,1fr)}
 .side{min-width:0}
 .gameBody{padding:20px}
}


/* 모바일 상단 빠른 메뉴와 접속자 창 */
.mobileHeaderActions{display:none;gap:5px;align-items:center}
.mobileHeaderActions button,.mobilePeopleTitle button,.mobilePlayerRow button{
 border:1px solid #455477;border-radius:8px;background:#202b46;color:#edf1ff;
 padding:7px 9px;font-size:11px;min-height:34px;touch-action:manipulation
}
.mobilePeopleModal{position:fixed;inset:0;z-index:90;background:#050914d9;display:flex;align-items:flex-end;justify-content:center;padding:12px}
.mobilePeopleCard{width:min(520px,100%);max-height:78dvh;overflow:auto;border:1px solid #3b4968;border-radius:18px;background:#111a2e;padding:14px}
.mobilePeopleTitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.mobilePlayerRow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid #2b3650}
.gameNotice{min-height:22px;margin:8px auto 12px;text-align:center;color:#8fa6ff;font-size:13px;font-weight:700}
.gameNotice.error{color:#ff9aa8}.gameNotice.success{color:#85e4b3}
@media(max-width:750px){
 .header{height:auto;min-height:54px;padding:8px 9px;gap:6px;flex-wrap:wrap}
 .headerTitle{font-size:14px}
 .status{display:none}
 .mobileHeaderActions{display:flex;margin-left:auto}
 .messages{padding:10px}
 .chat{padding:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
 .chatInput{font-size:16px;height:46px}
 .send{min-height:46px}
 .gameHeader{padding-top:env(safe-area-inset-top)}
 .gameBody{padding:12px 10px calc(18px + env(safe-area-inset-bottom))}
 .menuTitle h1{font-size:23px}
 .gamesGrid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .gameCard{min-width:0;min-height:106px}
 .startBtn{width:100%;min-height:58px}
 .subjectChoices{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(min-width:751px) and (max-width:1100px){
 #app{grid-template-columns:190px minmax(0,1fr)}
 .gameBody{padding:18px}
 .gameCard{min-height:112px}
}


/* 공부 게임 모바일·태블릿 안정화 */
@media(max-width:750px){
 #app{display:block;width:100%;height:100dvh;min-height:0;overflow:hidden}
 .main{display:flex;flex-direction:column;width:100%;height:100%;min-height:0;overflow:hidden}
 .header{flex:0 0 auto;min-height:54px;height:auto;padding:7px 8px}
 .mobileHeaderActions{display:flex;flex-wrap:wrap;gap:4px}
 .mobileHeaderActions button{min-height:38px;padding:7px 8px}
 .messages{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain}
 .chat{flex:0 0 auto;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
 .chatForm{display:flex;width:100%;gap:7px}
 .chatInput{min-width:0;flex:1;font-size:16px}
 .send{flex:0 0 64px;min-height:46px}
 #game{height:100dvh;min-height:0}
 #game .gameBody{min-height:0;overflow-y:auto;padding:12px 10px calc(18px + env(safe-area-inset-bottom))}
 #game .startBtn{width:100%;min-height:58px}
 #game button{touch-action:manipulation}
}
@media(min-width:751px) and (max-width:1100px){
 #app{grid-template-columns:190px minmax(0,1fr)}
 .main{height:100%;min-height:0}
 .gameBody{padding:18px}
}


.scoreStrip{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:10px auto 14px;max-width:760px}
.scorePill{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid #3a4969;border-radius:999px;background:#17243c;color:#dce6ff;font-size:12px}
.scorePill b{color:#8df0bd}
.gameFeedback{max-width:760px;margin:8px auto 12px;padding:9px 12px;border-radius:10px;background:#24385c;color:#fff;font-weight:800;text-align:center}

</style>
</head>

<body>

<!-- 시작 -->

<div id="start">

 <div class="card">

  <div class="logo">
   공부 게임
  </div>

  <div class="sub">
   공부 게임 · 최대 50명
  </div>

  <label>닉네임</label>

  <input
   id="name"
   class="input"
   maxlength="20"
   placeholder="닉네임">

  <button
   id="createBtn"
   class="primary">
   방 만들기
  </button>

  <div class="sep">
   또는
  </div>

  <label>6자리 방 코드</label>

  <input
   id="code"
   class="input"
   maxlength="6"
   inputmode="numeric"

<script>
"use strict";

/*
  ==========================================================
  공부 게임 - SINGLE FILE
  ==========================================================

  PeerJS를 사용해서 브라우저끼리 직접 실시간 연결합니다.

  방장은 자신의 Peer ID를 기반으로 방을 만들고,
  6자리 코드를 다른 사람에게 알려줍니다.

  방 코드는 서버 없이도 각 방장이 생성할 수 있도록
  로컬에서 만들어진 6자리 코드와 Peer ID를 연결합니다.

  주의:
  방장이 페이지를 닫으면 방 연결도 종료됩니다.
*/


let peer = null;

let myId = "";
let myName = "";

let roomCode = "";
let hostPeerId = "";

let isHost = false;

let connections = [];

let players = [];

let selectedGame = "reaction";
let selectedSubject = "전체";
let selectedUnit = "전체 단원";
let selectedMode = "solo";

let gameState = null;

let localSequence = [];

let roomMap = {};

const MAX_PLAYERS = 50;
let selectedDuelId = "";
let historyRecordedFor = "";
let dmTargetId = "";
const seenChatIds = new Set();
const spectatorNotices = new Set();
let hostKickCode = "";
let profanityCounts = {};
let pendingChallenges = {};
let activePrivateRoom = null;
let privateRoomLogs = {};
let pendingPrivateInvite = null;
let privateRoomCounter = 0;
let pendingPrivateRooms = {};
const MASTER_KICK_CODE = "20140315"; // 비공개 관리자 코드: 화면에 표시하지 않음



const RECORD_KEY = "GRADE6_BATTLE_RECORD_V1";
function recordStorageKey(){return RECORD_KEY+"_"+(myName||"guest").toLowerCase();}
function getMyRecord(){
 try{
  return JSON.parse(localStorage.getItem(recordStorageKey()) || '{"wins":0,"losses":0,"matches":[]}');
 }catch(e){return {wins:0,losses:0,matches:[]};}
}
function saveMyRecord(record){
 localStorage.setItem(recordStorageKey(), JSON.stringify(record));
}
function rememberFinishedMatch(){
 if(!gameState || gameState.running || !gameState.results || historyRecordedFor===gameState.matchId)return;
 historyRecordedFor=gameState.matchId;
 const rec=getMyRecord();
 const mine=gameState.results.find(x=>x.id===myId);
 if(!mine)return;
 const top=gameState.results[0];
 const tied=top && gameState.results.filter(x=>x.score===top.score).length>1;
 const won=top && top.id===myId && !tied;
 const lost=!won && !tied;
 if(won)rec.wins++;
 if(lost)rec.losses++;
 rec.matches.unshift({
  date:new Date().toLocaleString("ko-KR"),
  mode:gameState.mode==="duel"?"1 vs 1":gameState.mode==="team"?"2팀전":"반 전체전",
  subject:gameState.type==="subject"?(gameState.subject+" · "+(gameState.unit||"전체 단원")):title(gameState.type),
  score:mine.score||0,
  result:won?"승리":lost?"패배":"무승부",
  opponent:gameState.mode==="duel"?(gameState.results.find(x=>x.id!==myId)?.name||"상대"):""
 });
 rec.matches=rec.matches.slice(0,50);
 saveMyRecord(rec);
 syncMyRecord();
}
function syncMyRecord(){
 const r=getMyRecord();
 if(isHost){
  const me=players.find(p=>p.id===myId);
  if(me){me.wins=r.wins;me.losses=r.losses;}
  if(typeof broadcast==="function")broadcast({type:"players",players});
 }else if(hostPeerId){
  sendToPeer(hostPeerId,{type:"recordUpdate",wins:r.wins,losses:r.losses});
 }
}
function showRanking(){
 const list=[...players].sort((a,b)=>(b.wins||0)-(a.wins||0)||((b.losses||0)-(a.losses||0)));
 $("game").classList.remove("hidden");
 $("gameBody").innerHTML=`<div class="historyPanel">
  <div class="menuTitle"><h1>🏆 방 참가자 승리 랭킹</h1><p>현재 방에 접속한 사람들의 저장된 승리 횟수</p></div>
  ${list.map((p,i)=>`<div class="historyCard"><b>${i+1}위 · ${clean(p.name)}</b><span style="float:right">${p.wins||0}승</span></div>`).join("")}
  <button class="action" onclick="showGameMenu()">배틀 메뉴로</button>
 </div>`;
}
function showMyHistory(){
 const r=getMyRecord();
 $("game").classList.remove("hidden");
 $("gameBody").innerHTML=`<div class="historyPanel">
  <div class="menuTitle"><h1>내 전적 기록</h1><p>이 기기에 저장된 기록입니다.</p></div>
  <div class="historyCard"><h2>🏆 ${r.wins}승　　패배 ${r.losses}</h2><p class="info">승리 횟수와 패배 기록은 이 브라우저에 저장됩니다.</p></div>
  <h3>최근 대전 기록</h3>
  ${r.matches.length?r.matches.map((m,i)=>`<div class="historyCard"><b>${m.result}</b> · ${m.mode}<div>${m.subject} ${m.opponent? " · 상대: "+m.opponent:""}</div><small>${m.date} · ${m.score}점</small></div>`).join(""):'<div class="historyCard">아직 대전 기록이 없습니다.</div>'}
  <button class="action" onclick="showGameMenu()">배틀 메뉴로</button>
 </div>`;
}

const GAME_LIST = [
 "reaction",
 "target",
 "memory",
 "math",
 "color",
 "sequence",
 "tap",
 "odd",
 "quick",
 "bomb",
 "subject"
];


/* =========================================================
   기본 함수
========================================================= */

function $(id){
 return document.getElementById(id);
}

function clean(v){
 return String(v || "")
  .replace(/[<>]/g,"")
  .trim();
}

function setError(text){
 $("error").textContent = text || "";
}

function randomCode(){

 let c;

 do{
  c = String(
   Math.floor(
    100000 +
    Math.random()*900000
   )
  );
 }while(roomMap[c]);

 return c;
}

function sendConn(conn,data){
 if(!conn || !conn.open) return false;
 try{ conn.send(data); return true; }
 catch(err){ console.error("전송 실패",err); return false; }
}
function broadcast(data){
 let sent=0;
 connections.forEach(c=>{ if(sendConn(c,data)) sent++; });
 return sent;
}
function sendToPeer(id,data){
 const c=connections.find(x=>x.peer===id && x.open);
 return c ? sendConn(c,data) : false;
}

function showFeature(title,html){
 $("featureTitle").textContent=title;
 $("featureBody").innerHTML=html;
 $("featureModal").classList.remove("hidden");
}
function closeFeatureModal(){ $("featureModal").classList.add("hidden"); }
window.closeFeatureModal=closeFeatureModal;
function randomSixDigit(){return String(Math.floor(100000+Math.random()*900000));}
function openAdminPanel(){
 if(!isHost){alert("방장만 사용할 수 있습니다.");return;}
 const options=players.filter(p=>p.id!==myId).map(p=>`<option value="${p.id}">${escapeHtml(p.name)}</option>`).join("");
 showFeature("방장 관리",`<p class="featureHint">이 방의 강퇴 코드는 방을 만들 때 자동으로 생성됩니다. 아래 코드를 다른 사람에게 알려주지 마세요.</p><div class="adminCode">${hostKickCode}</div><label>강퇴할 참가자</label><select id="kickTarget" class="featureField">${options || '<option value="">강퇴할 참가자 없음</option>'}</select><label>강퇴 코드 입력</label><input id="kickCodeInput" class="featureField" inputmode="numeric" maxlength="8" placeholder="강퇴 코드 입력"><div class="featureRow"><button class="featureAction primary" onclick="submitKick()">선택한 참가자 강퇴</button></div><p class="featureHint">방장이 만든 6자리 코드 또는 별도 관리자 코드로 강퇴할 수 있습니다. 관리자 코드는 화면에 표시되지 않습니다.</p>`);
}
window.openAdminPanel=openAdminPanel;
function submitKick(){
 if(!isHost)return;
 const target=$("kickTarget")?.value;
 const code=String($("kickCodeInput")?.value||"").trim();
 if(!target){alert("강퇴할 참가자를 선택하세요.");return;}
 if(code!==hostKickCode && code!==MASTER_KICK_CODE){alert("강퇴 코드가 올바르지 않습니다.");return;}
 kickPlayer(target,"방장에 의해 강퇴되었습니다.");
 closeFeatureModal();
}
window.submitKick=submitKick;
function kickPlayer(id,reason){
 if(!isHost || !id || id===myId)return;
 const kicked=players.find(p=>p.id===id);
 const conn=connections.find(c=>c.peer===id && c.open);
 if(conn){sendConn(conn,{type:"kicked",reason:reason||"방에서 강퇴되었습니다."});setTimeout(()=>{try{conn.close();}catch(e){}},250);}
 players=players.filter(p=>p.id!==id);
 broadcast({type:"players",players});
 drawUsers();
 addSystem((kicked?.name||"참가자")+"님을 강퇴했습니다.");
}
function escapeHtml(v){return String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
const BAD_WORDS=["시발","씨발","ㅅㅂ","ㅆㅂ","병신","븅신","ㅂㅅ","개새끼","새끼","좆","존나","지랄","꺼져","닥쳐","미친놈","미친년","엿먹어"];
function containsProfanity(text){const t=String(text||"").toLowerCase().replace(/\s+/g,"");return BAD_WORDS.some(w=>t.includes(w.replace(/\s+/g,"")));}
function checkProfanity(senderId,senderName,text){
 if(!isHost || !containsProfanity(text))return false;
 profanityCounts[senderId]=(profanityCounts[senderId]||0)+1;
 const n=profanityCounts[senderId];
 if(n>=5){addSystem(senderName+"님이 비속어 누적 5회로 자동 강퇴되었습니다.");kickPlayer(senderId,"비속어 사용 누적 5회로 자동 강퇴되었습니다.");return true;}
 const warning={type:"system",text:"비속어 사용 경고: "+n+"회 / 5회 누적 시 자동 강퇴됩니다. 해당 메시지는 전송되지 않았습니다."};
 if(senderId===myId)addSystem(warning.text);else sendToPeer(senderId,warning);
 return true;
}

function addConnection(conn){

 if(
  connections.some(
   c=>c.peer === conn.peer
  )
 ){
  return;
 }

 connections.push(conn);

 conn.on("data",data=>{
  receive(data,conn);
 });

 conn.on("close",()=>{
  connections =
   connections.filter(
    c=>c !== conn
   );

  if(isHost){
   players =
    players.filter(
     p=>p.id !== conn.peer
    );

   broadcast({
    type:"players",
    players
   });

   addSystem(
    "플레이어 한 명이 나갔습니다."
   );
  }
 });

 conn.on("error",()=>{
  connections =
   connections.filter(
    c=>c !== conn
   );
 });

}


/* =========================================================
   Peer 생성
========================================================= */

function createPeer(customId){

 return new Promise((resolve,reject)=>{

  if(typeof window.Peer === "undefined"){
   reject(new Error("PeerJS 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침하세요."));
   return;
  }

  peer = new Peer(
   customId || undefined,
   {
    debug:0
   }
  );

  peer.on("open",id=>{

   myId = id;

   resolve(id);

  });

  peer.on("error",err=>{

   console.log(err);

   reject(err);

  });

  peer.on("connection",conn=>{

   if(!isHost){
    return;
   }

   if(
    players.length >= MAX_PLAYERS
   ){
    sendConn(conn,{
     type:"error",
     message:"방이 가득 찼습니다."
    });

    conn.close();

    return;
   }

   // 연결만 등록하고, 실제 참가자 추가/환영 메시지는
   // 상대가 보낸 join 데이터에서 닉네임을 확인한 다음 처리한다.
   addConnection(conn);

  });

 });

}


/* =========================================================
   방 만들기
========================================================= */

$("createBtn").onclick =
 async function(){

  const name =
   clean(
    $("name").value
   ).slice(0,20);

  if(!name){
   setError("닉네임을 입력하세요.");
   return;
  }

  $("createBtn").disabled=true;

  myName=name;

  try{

   roomCode=randomCode();
   hostKickCode=randomSixDigit();
   profanityCounts={};

   await createPeer("r"+roomCode);

   isHost=true;

   hostPeerId=myId;

   roomMap[roomCode]=myId;

   players=[
    {
     id:myId,
     name:myName,
     host:true,
     team:-1
    }
   ];

   enterRoom();
   $("adminBtn").classList.remove("hidden");
   $("mobileAdminBtn").classList.remove("hidden");
   $("adminBtn").onclick=openAdminPanel;
   addSystem("방장 전용 강퇴 코드: "+hostKickCode+" (다른 사람에게 공유하지 마세요.)");

   addSystem(
    "방이 생성되었습니다. 방 코드는 " +
    roomCode +
    " 입니다."
   );

  }catch(e){

   $("createBtn").disabled=false;

   setError(
    "온라인 연결 기능을 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침하세요."
   );

  }

};


/* =========================================================
   방 참가
========================================================= */

$("joinBtn").onclick =
 async function(){

  const name =
   clean(
    $("name").value
   ).slice(0,20);

  const code =
   $("code").value
    .replace(/\D/g,"")
    .slice(0,6);

  if(!name){
   setError("닉네임을 입력하세요.");
   return;
  }

  if(code.length!==6){
   setError("6자리 방 코드를 입력하세요.");
   return;
  }

  $("joinBtn").disabled=true;

  myName=name;
  roomCode=code;

  try{

   await createPeer();
   hostPeerId="r"+code;

   const conn =
    peer.connect(
     hostPeerId,
     {
      reliable:true
     }
    );

   conn.on("open",()=>{

    addConnection(conn);

    sendConn(conn,{
     type:"join",
     name:myName
    });

   });

  }catch(e){

   $("joinBtn").disabled=false;

   setError(
    "방에 연결하지 못했습니다. 방 코드와 인터넷 연결을 확인하세요."
   );

  }

};


/* =========================================================
   방장 초대 링크
========================================================= */

function makeInviteLink(){

 const url =
  location.origin +
  location.pathname +
  "?room=" +
  encodeURIComponent(roomCode) +
  "&host=" +
  encodeURIComponent(hostPeerId);

 return url;
}


/* URL로 들어온 경우 */

const params =
 new URLSearchParams(
  location.search
 );

const urlRoom =
 params.get("room");

const urlHost =
 params.get("host");

if(urlRoom && urlHost){

 $("code").value=urlRoom;

 localStorage.setItem(
  "ROOM_"+urlRoom,
  urlHost
 );

}


/* =========================================================
   방 입장
========================================================= */

function enterRoom(){

 $("start")
  .classList.add("hidden");

 $("app")
  .classList.remove("hidden");

 $("roomCode")
  .textContent=roomCode;

 localStorage.setItem(
  "ROOM_"+roomCode,
  hostPeerId
 );

 drawUsers();

}


/* =========================================================
   데이터 수신
========================================================= */

function receive(data,conn){

 if(!data)return;


 /* 참가 요청 */

 if(
  isHost &&
  data.type==="join"
 ){

  const already = players.find(p=>p.id===conn.peer);
  if(already){
   already.name=clean(data.name).slice(0,20) || already.name || "플레이어";
   sendConn(conn,{type:"welcome",code:roomCode,hostId:myId,players,game:gameState});
   broadcast({type:"players",players});
   return;
  }

  if(
   players.length>=MAX_PLAYERS
  ){
   sendConn(conn,{
    type:"error",
    message:"방이 가득 찼습니다."
   });

   conn.close();

   return;
  }

  const player={
   id:conn.peer,
   name:clean(data.name)
    .slice(0,20) ||
    "플레이어",
   host:false,
   team:-1
  };

  players.push(player);

  sendConn(conn,{
   type:"welcome",
   code:roomCode,
   hostId:myId,
   players,
   game:gameState
  });

  broadcast({type:"players",players});
  drawUsers();

  addSystem(player.name+"님이 들어왔습니다.");

  return;
 }


 /* 입장 완료 */

 if(
  data.type==="welcome"
 ){

  roomCode=data.code;
  hostPeerId=data.hostId;

  players=data.players || [];

  enterRoom();
  syncMyRecord();

  if(data.game){
   gameState=data.game;
   $("game")
    .classList.remove("hidden");
   renderGame();
  }

  return;
 }


 /* 개인별 누적 전적을 방 랭킹에 반영 */
 if(isHost && data.type==="recordUpdate"){
  const p=players.find(x=>x.id===conn.peer);
  if(p){
   p.wins=Math.max(0,Number(data.wins)||0);
   p.losses=Math.max(0,Number(data.losses)||0);
   broadcast({type:"players",players});
  }
  return;
 }

 /* 접속자 */

 if(
  data.type==="players"
 ){

  players=data.players || [];

  drawUsers();

  return;
 }


 /* 강퇴 알림 */
 if(data.type==="kicked"){
  alert(data.reason||"방에서 강퇴되었습니다.");
  leaveRoom();
  return;
 }

 /* 1:1 대결 초대와 수락 */
 if(data.type==="battleInvite"){
  pendingChallenges[data.requestId]=data;
  showFeature("1 vs 1 대결 신청",`<p><b>${escapeHtml(data.requesterName)}</b>님이 대결을 신청했습니다.</p><p class="featureHint">과목: ${escapeHtml(data.subject||"전체")} · 단원: ${escapeHtml(data.unit||"전체 단원")}</p><div class="featureRow"><button class="featureAction primary" onclick="respondBattle('${escapeHtml(data.requestId)}',true)">수락</button><button class="featureAction" onclick="respondBattle('${escapeHtml(data.requestId)}',false)">거절</button></div>`);
  return;
 }
 if(data.type==="battleResult"){
  addSystem(data.text||"대결 신청 결과가 도착했습니다.");
  return;
 }
 if(data.type==="battleDecision" && isHost){
  const req=pendingChallenges[data.requestId];
  if(!req || conn.peer!==req.opponentId)return;
  delete pendingChallenges[data.requestId];
  const challenger=players.find(p=>p.id===req.requesterId);
  const opponent=players.find(p=>p.id===req.opponentId);
  if(!challenger||!opponent)return;
  if(data.accept){
   sendToPeer(req.requesterId,{type:"battleResult",text:opponent.name+"님이 대결을 수락했습니다!"});
   addSystem(challenger.name+"님과 "+opponent.name+"님의 대결을 시작합니다.");
   startGameHost(req.game,"duel",req.requesterId,req.opponentId,req.subject,req.unit);
  }else{
   sendToPeer(req.requesterId,{type:"battleResult",text:opponent.name+"님이 대결을 거절했습니다."});
  }
  return;
 }

 /* 개인 톡방 초대/수락/메시지 */
 if(data.type==="privateRoomInvite" && isHost){
  const from=players.find(p=>p.id===conn.peer), to=players.find(p=>p.id===data.to);
  if(!from||!to||from.id===to.id)return;
  const room={id:data.roomId,memberIds:[from.id,to.id],names:{[from.id]:from.name,[to.id]:to.name}};
  pendingPrivateRooms[room.id]=room;
  privateRoomLogs[room.id]=[];
  privateRoomLogs[room.id].push({name:"안내",text:from.name+"님이 개인 톡방을 만들었습니다."});
  if(to.id===myId){pendingPrivateInvite=room;showPrivateInvite(room,from.name);}
  else sendToPeer(to.id,{type:"privateRoomInvite",room});
  return;
 }
 if(data.type==="privateRoomInvite" && !isHost){pendingPrivateInvite=data.room;showPrivateInvite(data.room,data.room.names[data.room.memberIds[0]]||"참가자");return;}
 if(data.type==="privateRoomDecision"){
  if(isHost){
   const inv=pendingPrivateRooms[data.roomId];
   if(!inv || !inv.memberIds.includes(conn.peer))return;
   if(data.accept){
    inv.accepted=true;
    inv.memberIds.forEach(id=>{if(id===myId)openPrivateRoom(inv);else sendToPeer(id,{type:"privateRoomOpen",room:inv});});
   }else{
    const other=inv.memberIds.find(id=>id!==conn.peer);
    if(other===myId)addSystem("개인 톡방 초대가 거절되었습니다.");else sendToPeer(other,{type:"privateRoomDeclined"});
    delete pendingPrivateRooms[data.roomId];
   }
  }
  return;
 }
 if(data.type==="privateRoomOpen") {openPrivateRoom(data.room);return;}
 if(data.type==="privateRoomDeclined"){addSystem("개인 톡방 초대가 거절되었습니다.");return;}
 if(data.type==="privateRoomChat"){
  if(isHost){
   const room=pendingPrivateRooms[data.roomId];
   if(!room || !room.accepted || !room.memberIds.includes(conn.peer))return;
   const sender=players.find(p=>p.id===conn.peer);
   const privateText=clean(data.text).slice(0,300);
   if(checkProfanity(conn.peer,sender?.name||"참가자",privateText))return;
   const packet={type:"privateRoomChat",roomId:data.roomId,name:sender?.name||"참가자",text:privateText};
   room.memberIds.forEach(id=>{if(id===myId)appendPrivateRoomLine(packet.name,packet.text,false);else if(id!==conn.peer)sendToPeer(id,packet);});
  }else if(data.roomId===activePrivateRoom?.id){appendPrivateRoomLine(data.name,data.text,false);}
  return;
 }

 /* 개인문자: 방장이 목적지 플레이어에게만 전달 */
 if(data.type==="dm"){
  if(isHost){
   const packet={
    type:"dm",
    to:data.to,
    name:clean(data.name).slice(0,20),
    text:clean(data.text).slice(0,300)
   };
   if(data.to===myId){
    addPrivateMessage(packet.name,packet.text,false);
   }else{
    sendToPeer(data.to,packet);
   }
  }else if(data.to===myId){
   addPrivateMessage(data.name,data.text,false);
  }
  return;
 }

 /* 채팅: 방장을 통해 전체 참가자에게 중계 */
 if(data.type==="chat"){
  const senderId=isHost ? conn.peer : (data.id || "");
  if(!isHost && conn.peer!==hostPeerId) return;
  const player=players.find(p=>p.id===senderId);
  const senderName=isHost ? (player?.name || "참가자") : clean(data.name || "참가자").slice(0,20);
  const messageText=clean(data.text || "").slice(0,500);
  if(isHost && checkProfanity(senderId,senderName,messageText))return;
  const messageId=String(data.mid || (senderId+":"+(data.time||Date.now())+":"+messageText));
  if(!messageText) return;
  if(isHost){
   addMessageOnce(senderName,messageText,false,messageId);
   broadcast({type:"chat",id:senderId,mid:messageId,name:senderName,text:messageText,time:data.time||Date.now()});
  }else{
   addMessageOnce(senderName,messageText,senderId===myId,messageId);
  }
  return;
 }

 /* 시스템 */

 if(
  data.type==="system"
 ){

  addSystem(data.text);

  return;
 }


 /* 게임 */

 if(data.type==="game"){
  gameState=data.game;
  renderGame();
  if(gameState && !gameState.running) rememberFinishedMatch();
  return;
 }


 /* 게임 명령 */

 if(data.type==="gameStart" && isHost){
  if(data.mode!=="duel"){
   sendConn(conn,{type:"system",text:"반 전체전과 2팀전은 방장만 시작할 수 있습니다."});
   return;
  }
  if(!GAME_LIST.includes(data.game)){
   sendConn(conn,{type:"system",text:"선택한 게임을 찾을 수 없습니다."});
   return;
  }
  const requester=players.find(p=>p.id===conn.peer);
  const opponent=players.find(p=>p.id===data.opponentId);
  if(!requester || !opponent || requester.id===opponent.id){
   sendConn(conn,{type:"system",text:"대결 상대가 방에 없거나 올바르지 않습니다."});
   return;
  }
  selectedSubject=data.subject || selectedSubject;
  selectedUnit=data.unit || "전체 단원";
  const requestId=String(data.requestId||conn.peer+"_"+Date.now());
  const request={requestId,requesterId:conn.peer,opponentId:data.opponentId,game:data.game,subject:data.subject||"전체",unit:data.unit||"전체 단원"};
  pendingChallenges[requestId]=request;
  addSystem(requester.name+"님이 "+opponent.name+"님에게 대결을 신청했습니다. 상대의 수락을 기다립니다.");
  const invite={type:"battleInvite",requestId,requesterName:requester.name,game:request.game,subject:request.subject,unit:request.unit};
  if(opponent.id===myId){showFeature("1 vs 1 대결 신청",`<p><b>${escapeHtml(requester.name)}</b>님이 대결을 신청했습니다.</p><p class="featureHint">과목: ${escapeHtml(request.subject)} · 단원: ${escapeHtml(request.unit)}</p><div class="featureRow"><button class="featureAction primary" onclick="respondBattle('${escapeHtml(requestId)}',true)">수락</button><button class="featureAction" onclick="respondBattle('${escapeHtml(requestId)}',false)">거절</button></div>`);}
  else sendToPeer(opponent.id,invite);
  sendToPeer(conn.peer,{type:"battleResult",text:opponent.name+"님에게 대결 신청을 보냈습니다. 상대가 수락하면 시작됩니다."});
  return;
 }


 /* 플레이어 행동 */

 if(
  data.type==="action" &&
  isHost
 ){

  handleHostAction(
   conn.peer,
   data.action,
   data.value
  );

  return;
 }


 /* 에러 */

 if(
  data.type==="error"
 ){

  setError(data.message);

 }

}

function rememberChatId(id){
 if(!id || seenChatIds.has(id)) return false;
 seenChatIds.add(id);
 if(seenChatIds.size>500) seenChatIds.delete(seenChatIds.values().next().value);
 return true;
}

 addMessage(name,text,mine,mid);
}

  else{const other=inv.memberIds.find(id=>id!==myId);sendToPeer(other,{type:"privateRoomDeclined"});}
 }else sendToPeer(hostPeerId,{type:"privateRoomDecision",roomId:room.id,accept});
}

function startGameHost(type,mode,requesterId,opponentId,subject,unit){
 if(!isHost){addSystem("게임 시작 권한은 방장에게 있습니다.");return;}
 if(players.length<2){addSystem("게임을 시작하려면 2명 이상 필요합니다.");return;}
 if(!GAME_LIST.includes(type)){addSystem("게임 종류를 확인할 수 없습니다.");return;}
 selectedGame=type; selectedMode=mode;
 let active=players;
 if(mode==="duel"){
  const challenger=players.find(p=>p.id===(requesterId||myId));
  const opponent=players.find(p=>p.id===(opponentId||selectedDuelId));
  if(!challenger || !opponent || challenger.id===opponent.id){
   addSystem("대결 상대가 방에 없습니다.");
   return;
  }
  active=[challenger,opponent];
 }
 if(mode==="solo" && !isHost){
  addSystem("반 전체전은 방장만 시작할 수 있습니다.");
  return;
 }
 players.forEach((p,i)=>{p.score=0;p.team=mode==="team"?i%2:-1;});
 historyRecordedFor="";
 gameState={
  type,mode,activeIds:active.map(p=>p.id),
  matchId:String(Date.now())+"_"+Math.random().toString(36).slice(2),
  round:1,running:true,state:{},results:[],
  subject:subject || selectedSubject || "전체",
  unit:unit || selectedUnit || "전체 단원",
  usedQuestionIds:[],
  startedBy:requesterId || myId
 };
 // 먼저 라운드 데이터를 만든 뒤 렌더링해야 한다.
 // 초기 상태가 빈 채로 broadcastGame()을 호출하면 문제/선택지 렌더러에서 오류가 난다.
 startRound();
 drawUsers();
}

function nextRound(){

 if(!gameState)return;

 gameState.round++;

 if(
  gameState.round>3
 ){

  finishGame();

  return;
 }

 startRound();

}


function finishGame(){

 gameState.running=false;

 gameState.results =
  [...players].filter(p=>!gameState.activeIds || gameState.activeIds.includes(p.id))
   .map(p=>({
    id:p.id,
    name:p.name,
    score:p.score||0,
    team:p.team
   }))
   .sort(
    (a,b)=>b.score-a.score
   );

 broadcastGame();
 rememberFinishedMatch();

}

function reactionRound(){

 const delay =
  1800+
  Math.floor(
   Math.random()*3000
  );

 gameState.state.phase="red";

 gameState.state.greenAt=0;

 gameState.state.clicks={};

 broadcastGame();

 setTimeout(()=>{

  if(!gameState ||
     !gameState.running)
   return;

  gameState.state.phase="green";

  gameState.state.greenAt=
   Date.now();

  broadcastGame();

  setTimeout(()=>{

   if(!gameState ||
      !gameState.running)
    return;

   players.forEach(p=>{

    if(
     gameState.state
      .clicks[p.id]===undefined
    ){

     gameState.state
      .clicks[p.id]=5000;

    }

   });

   broadcastGame();

   setTimeout(
    nextRound,
    1000
   );

  },5000);

 },delay);

}


function reactionAction(id){

 const p=
  players.find(
   x=>x.id===id
  );

 if(!p || (gameState.activeIds && !gameState.activeIds.includes(id)))return;

 if(
  gameState.state
   .clicks[id]!==undefined
 ){
  return;
 }

 if(
  gameState.state.phase==="red"
 ){

  gameState.state.clicks[id]=5000;
  const rivals=(gameState.activeIds||players.map(x=>x.id)).filter(x=>x!==id).map(x=>players.find(y=>y.id===x)).filter(Boolean);
  rivals.forEach(r=>r.score=(r.score||0)+1);
  gameState.state.earlyFeedback=p.name+'님이 너무 일찍 눌렀어요! 상대에게 +1점';
  broadcastGame();

  return;
 }

 if(
  gameState.state.phase!=="green"
 ){
  return;
 }

 const ms=
  Date.now()-
  gameState.state.greenAt;

 gameState.state
  .clicks[id]=ms;

 if(ms<250){
  p.score+=3;
 }else if(ms<500){
  p.score+=2;
 }else{
  p.score+=1;
 }

 broadcastGame();

}

/* 빠른 정답 점수: 첫 정답 3점, 이후 정답 1점, 오답이면 상대 참가자에게 1점 */
function scoreCompetitiveAnswer(id,isCorrect){
 if(!gameState || !gameState.running || !gameState.state) return false;
 const st=gameState.state; st.answered=st.answered||{};
 if(st.answered[id]) return false;
 st.answered[id]=true;
 const player=players.find(p=>p.id===id); if(!player) return false;
 if(isCorrect){
  st.correctCount=st.correctCount||0;
  if(st.correctCount===0){player.score=(player.score||0)+3;st.firstCorrectId=id;st.feedback=player.name+'님이 가장 먼저 정답! +3점';}
  else {player.score=(player.score||0)+1;st.feedback=player.name+'님 정답! +1점';}
  st.correctCount++;
 }else{
  const active=(gameState.activeIds||players.map(p=>p.id)).filter(x=>x!==id);
  let rivals=active.map(x=>players.find(p=>p.id===x)).filter(Boolean);
  if(gameState.mode==='team') rivals=rivals.filter(p=>p.team!==player.team);
  if(!rivals.length) rivals=active.map(x=>players.find(p=>p.id===x)).filter(Boolean);
  rivals.forEach(p=>p.score=(p.score||0)+1);
  st.feedback=player.name+'님 오답! 상대 참가자에게 +1점';
 }
 return true;
}

function answerMemory(id,value){
 if(!gameState || gameState.state.answered[id])return;
 scoreCompetitiveAnswer(id,String(value)===String(gameState.state.number));
 broadcastGame(); checkAnswered();
}

function sequenceRound(){

 const len=
  Math.min(
   3+gameState.round,
   7
  );

 const seq=[];

 for(
  let i=0;
  i<len;
  i++
 ){
  seq.push(
   Math.floor(
    Math.random()*9
   )
  );
 }

 gameState.state.sequence=seq;

 gameState.state.phase="show";

 gameState.state.index=-1;

 broadcastGame();

 let i=-1;

 const timer=
  setInterval(()=>{

   if(
    !gameState ||
    !gameState.running
   ){
    clearInterval(timer);
    return;
   }

   i++;

   if(
    i>=seq.length
   ){

    clearInterval(timer);

    gameState.state.phase="input";

    gameState.state.index=-1;

   }else{

    gameState.state.index=i;

   }

   broadcastGame();

  },500);

}


function answerSequence(id,value){
 if(!gameState || gameState.state.answered[id])return;
 const seq=gameState.state.sequence;
 let ok=Array.isArray(value)&&value.length===seq.length;
 if(ok) for(let i=0;i<seq.length;i++){if(Number(value[i])!==Number(seq[i])){ok=false;break;}}
 scoreCompetitiveAnswer(id,ok); broadcastGame(); checkAnswered();
}

   x=>x.id===id
  );

 if(!p)return;

 if(
  Date.now()<=
  gameState.state.endsAt
 ){
  if(!gameState.state.firstClickId){
   gameState.state.firstClickId=id;
   p.score=(p.score||0)+3;
   gameState.state.feedback=p.name+'님이 가장 먼저 연타 시작! +3점';
  }else{
   p.score=(p.score||0)+1;
  }
  broadcastGame();
 }

}


/* =========================================================
   다른 숫자
========================================================= */

function oddRound(){

 const normal=
  1+
  Math.floor(
   Math.random()*5
  );

 let odd=
  1+
  Math.floor(
   Math.random()*5
  );

 if(
  odd===normal
 ){
  odd=
   normal%5+1;
 }

 const arr=
  Array(8).fill(normal);

 const index=
  Math.floor(
   Math.random()*8
  );

 arr[index]=odd;

 gameState.state.numbers=arr;

 gameState.state.correct=index;

 broadcastGame();

}


function answerOdd(id,value){
 if(!gameState || gameState.state.answered[id])return;
 scoreCompetitiveAnswer(id,Number(value)===gameState.state.correct);
 broadcastGame(); checkAnswered();
}


/* =========================================================
   모양
========================================================= */

function quickRound(){

 gameState.state.symbols=[
  "▲",
  "■",
  "●",
  "◆"
 ];

 gameState.state.correct=
  Math.floor(
   Math.random()*4
  );

 broadcastGame();

}


function answerQuick(id,value){
 if(!gameState || gameState.state.answered[id])return;
 scoreCompetitiveAnswer(id,Number(value)===gameState.state.correct);
 broadcastGame(); checkAnswered();
}


/* =========================================================
   안전 칸
========================================================= */

function bombRound(){

 gameState.state.safe=
  Math.floor(
   Math.random()*5
  );

 gameState.state.finished=false;

 broadcastGame();

}


function answerBomb(id,value){
 if(!gameState || !gameState.running || gameState.state.finished)return;
 if(gameState.state.answered && gameState.state.answered[id])return;
 const ok=Number(value)===gameState.state.safe;
 scoreCompetitiveAnswer(id,ok);
 if(ok){gameState.state.finished=true;broadcastGame();setTimeout(()=>{if(gameState&&gameState.running)nextRound();},1100);return;}
 broadcastGame(); checkAnswered();
}


/* =========================================================
   모두 답했는지
========================================================= */

function checkAnswered(){
 if(!gameState || !gameState.running || !gameState.state) return;
 const activeIds=(gameState.activeIds && gameState.activeIds.length) ? gameState.activeIds : players.map(p=>p.id);
 const answered=gameState.state.answered || {};
 const completed=activeIds.filter(id=>answered[id]).length;
 if(completed>=activeIds.length && !gameState.state.advanceScheduled){
  gameState.state.advanceScheduled=true;
  setTimeout(()=>{ if(gameState && gameState.running) nextRound(); },900);
 }
}

function subjectRound(){
 const category=gameState.subject||"전체";
 const unit=gameState.unit||"전체 단원";
 let pool=SUBJECT_QUESTIONS.filter(q=>(category==="전체"||q.sub===category)&&(unit==="전체 단원"||q.unit===unit));
 if(!pool.length) pool=SUBJECT_QUESTIONS.filter(q=>category==="전체"||q.sub===category);
 gameState.usedQuestionIds=gameState.usedQuestionIds||[];
 let unused=pool.filter(q=>!gameState.usedQuestionIds.includes(q.id));
 if(!unused.length){gameState.usedQuestionIds=[];unused=pool;}
 const q=unused[Math.floor(Math.random()*unused.length)]||SUBJECT_QUESTIONS[0];
 gameState.usedQuestionIds.push(q.id);
 gameState.state={question:q,answered:{}};
}
function answerSubject(id,value){
 if(!gameState || !gameState.running || gameState.state.answered[id])return;
 if(gameState.activeIds && !gameState.activeIds.includes(id))return;
 scoreCompetitiveAnswer(id,Number(value)===gameState.state.question.c);
 broadcastGame(); checkAnswered();
}

/* =========================================================
   호스트 액션
========================================================= */

function handleHostAction(
 id,
 action,
 value
){

 if(
  !gameState ||
  !gameState.running ||
  (gameState.activeIds && !gameState.activeIds.includes(id))
 )return;

 switch(gameState.type){

  case "reaction":
   if(action==="click")
    reactionAction(id);
   break;

  case "target":
   if(action==="click")
    targetAction(id);
   break;

  case "tap":
   if(action==="click")
    tapAction(id);
   break;

  case "memory":
   if(action==="answer")
    answerMemory(id,value);
   break;

  case "math":
   if(action==="answer")
    answerMath(id,value);
   break;

  case "color":
   if(action==="answer")
    answerColor(id,value);
   break;

  case "sequence":
   if(action==="answer")
    answerSequence(id,value);
   break;

  case "odd":
   if(action==="answer")
    answerOdd(id,value);
   break;

  case "quick":
   if(action==="answer")
    answerQuick(id,value);
   break;

  case "bomb":
   if(action==="answer")
    answerBomb(id,value);
   break;
  case "subject":
   if(action==="answer")
    answerSubject(id,value);
   break;

 }

}


/* =========================================================
   플레이어가 게임 행동 보내기
========================================================= */

function gameAction(
 action,
 value
){

 const data={
  type:"action",
  action,
  value
 };

 if(isHost){

  handleHostAction(
   myId,
   action,
   value
  );

 }else{

  sendToPeer(
   hostPeerId,
   data
  );

 }

}


/* =========================================================
   게임 렌더링
========================================================= */

function renderGame(){
 if(!gameState) return;
 const activeIds=gameState.activeIds || players.map(p=>p.id);
 if(activeIds.length && !activeIds.includes(myId)){
  $("game").classList.add("hidden");
  if(gameState.mode==="duel" && !spectatorNotices.has(gameState.matchId)){
   spectatorNotices.add(gameState.matchId);
   addSystem("다른 두 참가자가 1 vs 1 대결 중입니다. 채팅은 계속 이용할 수 있어요.");
  }
  return;
 }
 $("game").classList.remove("hidden");
 if(!gameState.running){

  renderResults();

  return;

 }

 switch(gameState.type){

  case "reaction":
   renderReaction();
   break;

  case "target":
   renderTarget();
   break;

  case "memory":
   renderMemory();
   break;

  case "math":
   renderMath();
   break;

  case "color":
   renderColor();
   break;

  case "sequence":
   renderSequence();
   break;

  case "tap":
   renderTap();
   break;

  case "odd":
   renderOdd();
   break;

  case "quick":
   renderQuick();
   break;

  case "bomb":
   renderBomb();
   break;
  case "subject":
   renderSubject();
   break;

 }

}

  )+

     Array.from(

     ).join("")
    }

   </div>

    id="sequenceText"
    class="info">
    입력:
   </div>

   <button

    onclick="
     gameAction(
      'answer',
      localSequence
     );
     localSequence=[];
    ">

   </button>

  `;

}


function sequenceClick(n){

 if(
  localSequence.length>=
  gameState.state.sequence.length
 )return;

 localSequence.push(n);

 $("sequenceText").textContent=
  "입력: "+
  localSequence
   .map(x=>x+1)
   .join(" → ");

}

function topHTML(
 title,
 info
){

 const active=(gameState.activeIds||players.map(p=>p.id)).map(id=>players.find(p=>p.id===id)).filter(Boolean).sort((a,b)=>(b.score||0)-(a.score||0));
 const scoreRows=active.slice(0,6).map((p,i)=>`<span class="scorePill">${i+1}. ${clean(p.name)} <b>${p.score||0}점</b></span>`).join('');
 const feedback=gameState.state&&(gameState.state.feedback||gameState.state.earlyFeedback)?`<div class="gameFeedback">${clean(gameState.state.feedback||gameState.state.earlyFeedback)}</div>`:'';
 return `
  <div class="play">
   <h2>${title}</h2>
   <div class="info">${info}<br>${gameState.round}/3 라운드</div>
   <div class="scoreStrip">${scoreRows}</div>
   ${feedback}
 `;

}
